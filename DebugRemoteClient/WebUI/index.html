<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DV Multiplayer Observability</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">DERAIL VALLEY MULTIPLAYER</p><h1>Runtime observability</h1></div>
    <div id="connection" class="connection">Connecting…</div>
  </header>
  <main>
    <section id="sessions" class="sessions"></section>
    <nav class="view-tabs"><button id="events-tab" class="active">Event stream</button><button id="replication-tab">Item replication</button></nav>
    <section id="event-toolbar" class="toolbar" aria-label="Event filters">
      <input id="search" type="search" placeholder="Search events, entities and data…" autocomplete="off">
      <select id="session-filter"><option value="">All sessions</option></select>
      <select id="category-filter"><option value="">All categories</option></select>
      <select id="severity-filter"><option value="">All severities</option><option>Trace</option><option>Info</option><option>Warning</option><option>Error</option></select>
      <button id="pause">Pause</button>
      <button id="raw" class="quiet">Raw: off</button>
      <button id="mark" class="quiet">Mark</button>
      <button id="capture" class="quiet">Start capture</button>
      <button id="clear" class="quiet">Clear</button>
    </section>
    <section id="inspector" class="inspector" hidden>
      <div class="inspector-head"><div><p class="eyebrow">PINNED EVENT</p><h2 id="inspector-title"></h2><p id="inspector-meta" class="meta"></p></div><button id="close-inspector" class="quiet">Close</button></div>
      <pre id="inspector-detail"></pre>
    </section>
    <section id="event-stats" class="stats"><span id="count">0 events</span><span id="filtered"></span></section>
    <section id="events" class="events" aria-live="polite"></section>
    <section id="replication-view" hidden>
      <div class="replication-toolbar">
        <input id="replication-search" type="search" placeholder="Search item ID, update type or discontinuity…" autocomplete="off">
        <select id="replication-status"><option value="">All statuses</option><option>Pending</option><option>Complete</option><option>Rejected</option><option>Discontinuity</option><option>Ambiguous</option></select>
        <label class="check"><input id="replication-problems" type="checkbox"> Problems only</label>
        <button id="replication-captures" class="quiet">Auto captures: off</button>
      </div>
      <div class="replication-layout">
        <section><div class="stats"><span id="replication-count">0 operations</span></div><div id="replication-list" class="replication-list"></div></section>
        <section id="replication-detail" class="replication-detail"><p class="empty">Select a replication operation.</p></section>
      </div>
    </section>
  </main>
  <template id="event-template">
    <article class="event"><button class="event-head"><time></time><span class="session"></span><span class="direction"></span><span class="type"></span><span class="summary"></span><span class="status"></span></button></article>
  </template>
  <script src="app.js"></script>
</body>
</html>
